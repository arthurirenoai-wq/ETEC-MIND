<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Coordenação</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; display: flex; justify-content: center; padding: 40px; }
        .container { background: #2d2d2d; padding: 30px; border-radius: 8px; width: 100%; max-width: 800px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { border-bottom: 2px solid #0056b3; padding-bottom: 10px; margin-bottom: 20px; }
        
        .relato-card { background: #3d3d3d; border-left: 5px solid #0056b3; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
        .relato-header { display: flex; justify-content: space-between; font-size: 14px; color: #aaa; margin-bottom: 10px; }
        .relato-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; color: #66b3ff; }
        .relato-body { font-size: 16px; line-height: 1.5; }
        
        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; background: #555; }
        .nivel-Alta { background: #e74c3c; color: white; }
        .nivel-Média { background: #f39c12; color: white; }
        .nivel-Baixa { background: #2ecc71; color: white; }
    </style>
</head>
<body>

    <main class="container">
        <h1>Painel de Recebimento - Secretaria</h1>
        <p>Aguardando novos relatos em tempo real...</p>
        
        <!-- Onde os relatos vão aparecer -->
        <div id="lista-relatos"></div>
    </main>

    <script>
        // Função para ler o banco de dados e desenhar na tela
        function carregarRelatos() {
            const containerLista = document.getElementById('lista-relatos');
            
            // Puxa os dados salvos pelo aluno
            let relatos = JSON.parse(localStorage.getItem('bancoDeDadosRelatos')) || [];
            
            // Limpa a tela antes de desenhar os novos
            containerLista.innerHTML = '';

            if (relatos.length === 0) {
                containerLista.innerHTML = '<p style="color: #888;">Nenhum relato recebido ainda.</p>';
                return;
            }

            // Inverte a lista para o mais recente aparecer primeiro
            relatos.reverse().forEach(relato => {
                const card = document.createElement('div');
                card.className = 'relato-card';
                
                card.innerHTML = `
                    <div class="relato-header">
                        <span><strong>Aluno:</strong> ${relato.nome}</span>
                        <span><strong>Data:</strong> ${relato.data}</span>
                    </div>
                    <div class="relato-title">${relato.materia}</div>
                    <div class="relato-body">
                        <p>${relato.detalhes}</p>
                        <br>
                        <span class="status-badge nivel-${relato.nivel}">Dificuldade: ${relato.nivel}</span>
                    </div>
                `;
                containerLista.appendChild(card);
            });
        }

        // Carrega os relatos assim que a página da coordenação é aberta
        window.onload = carregarRelatos;

        // O SEGREDO DO TEMPO REAL: Escuta qualquer mudança que ocorrer no navegador
        window.addEventListener('storage', function(evento) {
            if (evento.key === 'bancoDeDadosRelatos') {
                // Se o banco de dados for alterado em outra aba, atualiza a tela na hora
                carregarRelatos();
            }
        });
    </script>
</body>
</html>
