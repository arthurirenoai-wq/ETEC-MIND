<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Coordenação</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; display: flex; justify-content: center; padding: 40px; }
        .container { background: #2d2d2d; padding: 30px; border-radius: 8px; width: 100%; max-width: 800px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { border-bottom: 2px solid #0056b3; padding-bottom: 10px; margin-bottom: 20px; }
        
        .relato-card { background: #3d3d3d; border-left: 5px solid #0056b3; padding: 15px; margin-bottom: 15px; border-radius: 4px; transition: opacity 0.3s; }
        .relato-header { display: flex; justify-content: space-between; font-size: 14px; color: #aaa; margin-bottom: 10px; }
        .relato-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; color: #66b3ff; }
        .relato-body { font-size: 16px; line-height: 1.5; }
        
        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; background: #555; }
        .nivel-Alta { background: #e74c3c; color: white; }
        .nivel-Média { background: #f39c12; color: white; }
        .nivel-Baixa { background: #2ecc71; color: white; }
    </style>
</head>
<body>

    <main class="container">
        <h1>Painel de Recebimento - Secretaria</h1>
        <p>Aguardando novos relatos em tempo real...</p>
        
        <!-- Onde os relatos vão aparecer -->
        <div id="lista-relatos"></div>
    </main>

    <script>
        // Função para ler o banco de dados e desenhar na tela
        function carregarRelatos() {
            const containerLista = document.getElementById('lista-relatos');
            
            // Puxa os dados salvos pelo aluno
            let relatos = JSON.parse(localStorage.getItem('bancoDeDadosRelatos')) || [];
            
            // Limpa a tela antes de desenhar os novos
            containerLista.innerHTML = '';

            if (relatos.length === 0) {
                containerLista.innerHTML = '<p style="color: #888;">Nenhum relato recebido ainda.</p>';
                return;
            }

            // Inverte a lista para o mais recente aparecer primeiro
            relatos.reverse().forEach(relato => {
                const card = document.createElement('div');
                card.className = 'relato-card';
                card.id = `relato-${relato.id}`;
                
                // Formata o texto para exibir o email se ele existir
                const textoEmail = (relato.email && relato.email !== "Não informado") 
                    ? ` (${relato.email})` 
                    : "";

                // Exibe o botão de enviar e-mail APENAS se o aluno digitou um e-mail
                const botaoEmail = (relato.email && relato.email !== "Não informado") 
                    ? `<button onclick="enviarEmailAutomatico('${relato.nome}', '${relato.email}', '${relato.materia}')" style="background-color: #28a745; color: white; padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px;">✉️ Enviar E-mail</button>` 
                    : ``;

                card.innerHTML = `
                    <div class="relato-header">
                        <!-- O e-mail agora aparece logo na frente do nome -->
                        <span><strong>Aluno:</strong> ${relato.nome} <span style="color:#66b3ff">${textoEmail}</span></span>
                        <span><strong>Data:</strong> ${relato.data}</span>
                    </div>
                    <div class="relato-title">${relato.materia}</div>
                    <div class="relato-body">
                        <p>${relato.detalhes}</p>
                        <br>
                        <span class="status-badge nivel-${relato.nivel}">Dificuldade: ${relato.nivel}</span>
                    </div>
                    
                    <div style="margin-top: 15px; display: flex; gap: 10px; border-top: 1px solid #555; padding-top: 15px;">
                        ${botaoEmail}
                        <button onclick="marcarResolvido('relato-${relato.id}')" style="background-color: #6c757d; color: white; padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px;">
                            ✔ Marcar como Resolvido
                        </button>
                    </div>
                `;
                containerLista.appendChild(card);
            });
        }

        // ================= FUNÇÕES ATUALIZADAS =================

        // Função que abre o e-mail preenchido automaticamente, sem perguntar nada
        function enviarEmailAutomatico(nomeAluno, emailAluno, materia) {
            const assunto = `ETEC MIND - Retorno sobre seu relato de ${materia}`;
            
            // Se for anônimo, muda a saudação
            const saudacao = (nomeAluno !== "Anônimo") ? `Olá, ${nomeAluno}!` : `Olá!`;
            
            const mensagem = `${saudacao}\n\nA coordenação e o professor da matéria de ${materia} receberam o seu relato.\n\nGostaríamos de conversar com você para ajudar a resolver essa dificuldade. Por favor, nos procure na coordenação ou responda este e-mail.\n\nAtenciosamente,\nEquipe ETEC MIND.`;
            
            // Abre o programa de e-mail com o endereço correto
            window.location.href = `mailto:${emailAluno}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(mensagem)}`;
        }

        // Função que marca o card visualmente como resolvido
        function marcarResolvido(idCard) {
            const card = document.getElementById(idCard);
            if(card) {
                card.style.opacity = '0.4';
                card.style.pointerEvents = 'none';
                
                const confirmacao = document.createElement('p');
                confirmacao.style.color = '#2ecc71';
                confirmacao.style.fontWeight = 'bold';
                confirmacao.style.marginTop = '10px';
                confirmacao.innerText = 'Resolvido e Arquivado ✔';
                
                card.appendChild(confirmacao);
            }
        }

        // ================= FIM DAS FUNÇÕES =================

        // Carrega os relatos assim que a página da coordenação é aberta
        window.onload = carregarRelatos;

        // Escuta qualquer mudança que ocorrer no navegador para o tempo real
        window.addEventListener('storage', function(evento) {
            if (evento.key === 'bancoDeDadosRelatos') {
                carregarRelatos();
            }
        });
    </script>
</body>
</html>
